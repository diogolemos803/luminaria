workflows:
  ios-testflight:
    name: iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: LuminariaAppStoreKey   # nome que você vai dar à chave no passo "Integrations" do Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.luminaria.app
      vars:
        XCODE_PROJECT: "Luminaria.xcodeproj"
        XCODE_SCHEME: "Luminaria"
        APP_STORE_APPLE_ID: 6798370889
      xcode: latest
      cocoapods: default

    scripts:
      - name: Aplicar perfis de provisionamento no projeto
        script: |
          xcode-project use-profiles

      - name: Incrementar o número de build automaticamente
        script: |
          # get-latest-app-store-build-number busca a versão pública da App Store, que
          # ainda não existe (só enviamos pro TestFlight) - por isso sempre falhava e
          # caía no fallback "0", gerando o mesmo número "1" repetido e sendo rejeitado
          # pela Apple ("bundle version must be higher than the previously uploaded
          # version"). get-latest-testflight-build-number busca o último número já no
          # TestFlight, que é o que precisamos aqui.
          #
          # 2026-10-19: a consulta voltou a falhar calada (caía no "0" e gerava "1", já
          # usado → "attribute with a value that has already been used"). Agora o número
          # é o MAIOR entre "último do TestFlight + 1" e o contador de builds do próprio
          # Codemagic ($BUILD_NUMBER, que só cresce e nunca é menor que qualquer número já
          # enviado, porque cada envio saiu de um build). E o resultado da consulta
          # aparece no log, pra não falhar escondido de novo.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>&1 | tail -1)
          echo "Último build no TestFlight (consulta): $LATEST"
          case "$LATEST" in
            ''|*[!0-9]*) LATEST=0 ;;
          esac
          NEXT=$((LATEST + 1))
          if [ "${BUILD_NUMBER:-0}" -gt "$NEXT" ]; then NEXT=$BUILD_NUMBER; fi
          echo "Número deste build: $NEXT"
          agvtool new-version -all "$NEXT"

      - name: Compilar o IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM

    publishing:
      email:
        recipients:
          - diogolemos803@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        # submit_to_testflight desligado de propósito: essa flag dispara um envio pra
        # "Beta App Review" da Apple, que só é exigido de verdade pra testadores
        # EXTERNOS. Grupos de Teste Interno (nosso caso, "Interno") nunca precisam de
        # revisão - ficam disponíveis pros testadores assim que a Apple termina de
        # processar o binário, automaticamente. Com a flag ligada, toda vez que já
        # havia uma revisão pendente de um build anterior (que nunca é aprovada nem
        # rejeitada em teste puramente interno), o envio do build novo travava com
        # "Another build is in review" - o upload e o processamento sempre funcionavam,
        # só essa etapa extra e desnecessária que falhava.

    # Builds só manuais por enquanto (sem bloco "triggering"): como o projeto ainda está em

    # Builds só manuais por enquanto (sem bloco "triggering"): como o projeto ainda está em
    # desenvolvimento ativo com pushes frequentes na main, disparar um build+envio ao
    # TestFlight a cada push consumiria minutos do Codemagic e criaria uma build nova pros
    # testadores toda hora. Rode manualmente pelo painel do Codemagic ("Start new build")
    # quando quiser cortar uma versão de teste de verdade.
