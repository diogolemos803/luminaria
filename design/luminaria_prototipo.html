<title>Luminária — protótipo</title>
<style>
  :root {
    --stage-awake: #F4F3F0;
    --stage-sleep: #21242A;
    --btn-awake: #FFFFFF;
    --btn-sleep: #33373E;
    --ink: #6B6A66;
    --ink-sleep: #8B8E94;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 32px 16px;
  }
  .stage {
    width: 300px;
    height: 560px;
    border-radius: 40px;
    background: var(--stage-awake);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    transition: background-color 480ms ease;
    box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  }
  .stage.sleep { background: var(--stage-sleep); }
  .btn {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
    background: var(--btn-awake);
    box-shadow: 0 14px 34px rgba(0,0,0,0.20), 0 2px 6px rgba(0,0,0,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: background-color 480ms ease, transform 140ms ease;
  }
  .stage.sleep .btn { background: var(--btn-sleep); }
  .btn.pressed { transform: scale(0.87); }
  .btn img {
    width: 92%;
    height: 92%;
    object-fit: contain;
    pointer-events: none;
  }
  .label {
    position: absolute;
    bottom: 40px;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--ink);
    transition: color 480ms ease;
  }
  .stage.sleep .label { color: var(--ink-sleep); }
  .hint {
    font-size: 13px;
    color: #8A8A86;
  }
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <button class="btn" id="btn" aria-label="Alternar modo noite">
      <img id="icon" src="" alt="" />
    </button>
    <p class="label" id="label">Living mode</p>
  </div>
  <p class="hint">toque no botão para alternar</p>
</div>

  const stage = document.getElementById('stage');
  const btn = document.getElementById('btn');
  const icon = document.getElementById('icon');
  const label = document.getElementById('label');

  let sleeping = false;
