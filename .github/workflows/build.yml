name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (device, sem assinatura)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # Destino trocado de "iOS Simulator" pra "iOS" (device generico, sem assinatura):
      # FamilyControls/ManagedSettings (Screen Time API) nao tem suporte ao Simulador da
      # Apple - o build falhava na compilacao ("no such module") ao linkar contra esses
      # frameworks pro SDK do Simulador. Mesma receita ja usada com sucesso em
      # sideload-ipa.yml (so existe na branch teste-gratis-sem-nfc).
      - name: Build for iOS device (sem assinatura)
        run: |
          xcodebuild build \
            -project Luminaria.xcodeproj \
            -scheme Luminaria \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
