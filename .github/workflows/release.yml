name: iOS Release (Archive + TestFlight)

# Disparo manual: rode em Actions > iOS Release > Run workflow.
# Antes de usar, configure os secrets do repositório (Settings > Secrets and variables > Actions):
#   BUILD_CERTIFICATE_BASE64        -> certificado de distribuição (.p12) exportado do Keychain, em base64
#   P12_PASSWORD                    -> senha usada ao exportar o .p12
#   BUILD_PROVISION_PROFILE_BASE64  -> provisioning profile (.mobileprovision) da App Store, em base64
#   KEYCHAIN_PASSWORD               -> senha qualquer, só usada para o keychain temporário da CI
#   APPSTORE_ISSUER_ID               -> Issuer ID da App Store Connect API (App Store Connect > Users and Access > Integrations)
#   APPSTORE_API_KEY_ID               -> Key ID da API key criada em App Store Connect
#   APPSTORE_API_PRIVATE_KEY          -> conteúdo do arquivo AuthKey_XXXX.p8 baixado ao criar a API key
#
# Também edite ExportOptions.plist na raiz do projeto, trocando SUBSTITUA_PELO_SEU_TEAM_ID
# pelo seu Team ID (Apple Developer > Membership).

on:
  workflow_dispatch:

jobs:
  release:
    name: Archive & Upload to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Archive
        run: |
          xcodebuild archive \
            -project Luminaria.xcodeproj \
            -scheme Luminaria \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Luminaria.xcarchive" \
            -destination 'generic/platform=iOS'

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Luminaria.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_API_PRIVATE_KEY" > "~/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/Luminaria.ipa" \
            -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
